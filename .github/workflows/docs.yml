# Build the VS2 / VS Core API reference with Dokka and publish it to GitHub Pages.
#
# The generated site is intentionally not committed (see .gitignore). This
# workflow rebuilds it from the resolved VS2/VS Core sources on every relevant
# change, so the published reference always matches the pinned versions.
#
# One-time setup: in the repository Settings -> Pages, set "Source" to
# "GitHub Actions". After that the site is served from
# https://<owner>.github.io/<repo>/ .

name: Docs

on:
  push:
    branches:
      - '1.20.1/main'
      - main
    paths:
      - 'docs/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate VS2 / VS Core API docs (Dokka)
        run: ./gradlew --no-daemon dokkaGeneratePublicationHtml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/vs2-api/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
