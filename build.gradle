import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Make sure this version matches the one included in Kotlin for Forge
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        // OPTIONAL Gradle plugin for Kotlin Serialization
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.22'
    }
}

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'

    id "org.jetbrains.kotlin.jvm" version "$kotlin_version"

    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.4.5"
    id "com.github.johnrengelman.shadow" version "7.1.2"

    id("org.jetbrains.dokka") version "2.2.0"
}

java {
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty "forge.enabledGameTestNamespaces", mod_id
        }
        data {
            data()
        }
        server {
            server()
            type = "gameTestServer"
            systemProperty "forge.enabledGameTestNamespaces", mod_id
        }
    }

    mods {
        // Should this be vs_addon_template instead of testproject? I'm not sure
        testproject {
            sourceSet sourceSets.main
        }
    }
}


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    //Add any repositories to fetch dependencies from here.
    //Most dependencies are mirrored to the VS Maven, so by default only it is included alongside mavenLocal and KFF.
    mavenLocal()
    maven {
        name = "VS Collisions"
        url = project.vs_maven_url ?: 'https://maven.valkyrienskies.org'
        content {
            excludeGroup "thedarkcolour"
        }
        if (project.vs_maven_username && project.vs_maven_password) {
            credentials {
                username = project.vs_maven_username
                password = project.vs_maven_password
            }
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven {
        url = 'https://maven.realrobotix.me/createbigcannons/'
        content { includeModule('com.rbasamoyai', 'createbigcannons') }
    }
    maven {
        url = 'https://maven.realrobotix.me/ritchiesprojectilelib/'
        content { includeModule('com.rbasamoyai', 'ritchiesprojectilelib') }
    }
}


dependencies {
    // region mixins
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    // endregion

    // region Valkyrien Skies
    implementation("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:impl:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    modApi("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }
    // endregion

    // region VS deps
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.13.3"
    compileOnly("org.joml:joml:1.10.4")
    compileOnly("org.joml:joml-primitives:1.10.0")
    modImplementation "thedarkcolour:kotlinforforge:4.11.0"
    modCompileOnly "com.rbasamoyai:createbigcannons:${cbc_version}"
    // endregion

    // Create
    //modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    //modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    //modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    //modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    //modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI
    //modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    //modImplementation("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    options.release = 17
}

tasks.withType(KotlinJvmCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-Xjvm-default=all"

    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

processResources {
    var replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_license     : mod_license,
            mod_version     : mod_version,
            mod_authors     : mod_authors,
            mod_description : mod_description,
            minecraft_version: minecraft_version,
            vs2_version: vs2_version,
            homepage: homepage,
            sources: sources,
            issue_tracker: issue_tracker


    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    it.options.release = 17
}

// region VS2 / VS Core API documentation (Dokka)
//
// Generate a real Dokka site for the Valkyrien Skies 2 and VS Core *sources*
// resolved by this build, reusing the project's full Minecraft/Forge/JOML
// classpath. The mod's own sources are suppressed so the output is a standalone
// VS2/VS Core reference.
//
//   ./gradlew dokkaGeneratePublicationHtml
//   -> docs/vs2-api/api/index.html

configurations {
    vsApiSources {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    vsApiSources "org.valkyrienskies.core:api:${vs_core_version}:sources"
    vsApiSources "org.valkyrienskies.core:internal:${vs_core_version}:sources"
    vsApiSources "org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}:sources"
}

tasks.register('extractVsApiSources', Sync) {
    from({ configurations.vsApiSources.collect { zipTree(it) } })
    include 'org/valkyrienskies/**'
    into layout.buildDirectory.dir('vs-api-sources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dokka {
    moduleName.set('vs2-core-api')
    moduleVersion.set("${vs2_version} / ${vs_core_version}")
    modulePath.set('vs2-core-api')
    dokkaSourceSets.configureEach {
        sourceRoots.from(tasks.named('extractVsApiSources'))
        // Only document VS2 / VS Core; hide this repository's own code.
        perPackageOption {
            matchingRegex.set('dev\\.kkazi.*')
            suppress.set(true)
        }
        // Hide implementation noise (mixins, duck interfaces, compat shims,
        // client renderers). The public and internal API remain documented.
        ['mod\\.mixin', 'mod\\.mixinducks', 'mod\\.compat', 'mod\\.client',
         'mod\\.event', 'mod\\.forge\\.mixin', 'mod\\.forge\\.compat',
         'mod\\.platform', 'mod\\.util'].each { sub ->
            perPackageOption {
                matchingRegex.set("org\\.valkyrienskies\\.${sub}.*")
                suppress.set(true)
            }
        }
        perPackageOption {
            matchingRegex.set('org\\.valkyrienskies.*')
        }
        reportUndocumented.set(false)
        skipDeprecated.set(false)
        skipEmptyPackages.set(true)
    }
    dokkaPublications.configureEach {
        failOnWarning.set(false)
        suppressObviousFunctions.set(true)
    }
    dokkaPublications.named('html') {
        outputDirectory.set(layout.projectDirectory.dir('docs/vs2-api/api'))
    }
}
// endregion
